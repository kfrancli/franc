<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K. FRANCK — Portfolio en maintenance</title>
<meta name="description" content="Le portfolio de K. FRANCK, administrateur système, est en cours de maintenance. Retour très bientôt.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eeeafb;
    --bg2: #e2f6ef;
    --ink: #2b2a55;
    --muted: #5b5a85;
    --card: #ffffff;
    --mint: #6fdcbb;
    --coral: #ff8a7a;
    --sun: #ffd65a;
    --rack: #2b2a55;
    --rack-line: #4a4985;
    --floor: rgba(43, 42, 85, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b3a;
      --bg2: #17323a;
      --ink: #f1efff;
      --muted: #b9b7e0;
      --card: #272652;
      --rack: #14132b;
      --rack-line: #3a3970;
      --floor: rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b3a; --bg2: #17323a; --ink: #f1efff; --muted: #b9b7e0;
    --card: #272652; --rack: #14132b; --rack-line: #3a3970; --floor: rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    display: grid;
    place-items: center;
    padding: 24px 20px;
    overflow-x: hidden;
  }

  main {
    width: min(760px, 100%);
    text-align: center;
  }

  .scene {
    width: 100%;
    max-width: 640px;
    height: auto;
    margin: 0 auto 8px;
    display: block;
    overflow: visible;
  }

  h1 {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -.01em;
    margin: 8px 0 12px;
  }
  .lead {
    color: var(--muted);
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    line-height: 1.6;
    max-width: 52ch;
    margin: 0 auto 26px;
  }
  .lead strong { color: var(--ink); font-weight: 600; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 999px;
    padding: 12px 22px 12px 16px;
    box-shadow: 0 6px 0 var(--floor);
    font-weight: 600;
    min-height: 52px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--mint);
    animation: pulse 1.6s ease-in-out infinite;
  }
  #msg { min-width: 20ch; text-align: left; transition: opacity .25s; }

  .bar {
    width: min(360px, 80%);
    height: 12px;
    background: var(--card);
    border-radius: 999px;
    margin: 26px auto 0;
    overflow: hidden;
    box-shadow: inset 0 2px 0 var(--floor);
  }
  .bar i {
    display: block;
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: repeating-linear-gradient(-45deg, var(--mint) 0 12px, #8ee9cd 12px 24px);
    background-size: 34px 34px;
    animation: slide 2.6s ease-in-out infinite alternate, stripes 1s linear infinite;
  }

  footer { margin-top: 28px; color: var(--muted); font-size: .95rem; }

  /* ----- animations ----- */
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .55; } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(138%); } }
  @keyframes stripes { to { background-position: 34px 0; } }
  @keyframes blink { 0%,45%,55%,100% { opacity: 1; } 50% { opacity: .15; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes wrench { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(18deg); } }
  @keyframes type { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes wifi { 0%,100% { opacity: .2; } 30% { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .led { animation: blink 1.4s infinite; }
  .l2 { animation-delay: .35s; } .l3 { animation-delay: .7s; } .l4 { animation-delay: 1.05s; }
  .char { animation: bob 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  .char.b { animation-delay: 1.1s; }
  .eye { transform-box: fill-box; transform-origin: center; animation: eyes 4s infinite; }
  .wrench { transform-box: fill-box; transform-origin: 85% 85%; animation: wrench 1s ease-in-out infinite; }
  .cursor { animation: type 1s steps(1) infinite; }
  .w1 { animation: wifi 1.8s infinite; } .w2 { animation: wifi 1.8s .3s infinite; } .w3 { animation: wifi 1.8s .6s infinite; }
  .cloud { animation: float 4s ease-in-out infinite; transform-box: fill-box; }
  .bubble { animation: float 3s ease-in-out infinite; transform-box: fill-box; }

  :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .packet { display: none; }
  }
</style>
</head>
<body>
<main>
  <svg class="scene" viewBox="0 0 640 340" role="img" aria-label="Deux techniciens réseau s’affairent autour d’une baie de serveurs">
    <!-- sol -->
    <ellipse cx="320" cy="312" rx="290" ry="18" fill="var(--floor)"/>

    <!-- nuage + wifi -->
    <g class="cloud">
      <path d="M262 62a22 22 0 0 1 4-43 28 28 0 0 1 52-6 24 24 0 0 1 36 17 20 20 0 0 1-4 40z" fill="var(--card)"/>
      <g fill="none" stroke="var(--mint)" stroke-width="5" stroke-linecap="round">
        <path class="w3" d="M296 34a26 26 0 0 1 36 0"/>
        <path class="w2" d="M303 42a16 16 0 0 1 22 0"/>
      </g>
      <circle class="w1" cx="314" cy="50" r="3.5" fill="var(--mint)"/>
    </g>

    <!-- câbles -->
    <path id="c1" d="M214 292 C 244 330, 252 262, 280 262" fill="none" stroke="var(--coral)" stroke-width="6" stroke-linecap="round"/>
    <path id="c2" d="M360 150 C 430 120, 436 214, 488 226" fill="none" stroke="var(--sun)" stroke-width="6" stroke-linecap="round"/>
    <circle class="packet" r="5" fill="#fff" stroke="var(--coral)" stroke-width="2.5">
      <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion>
    </circle>
    <circle class="packet" r="5" fill="#fff" stroke="var(--sun)" stroke-width="2.5">
      <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#c2"/></animateMotion>
    </circle>
    <circle class="packet" r="5" fill="#fff" stroke="var(--sun)" stroke-width="2.5">
      <animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion>
    </circle>

    <!-- baie serveurs -->
    <g>
      <rect x="272" y="86" width="96" height="214" rx="14" fill="var(--rack)"/>
      <g stroke="var(--rack-line)" stroke-width="3" stroke-linecap="round">
        <line x1="286" y1="136" x2="354" y2="136"/><line x1="286" y1="186" x2="354" y2="186"/><line x1="286" y1="236" x2="354" y2="236"/>
      </g>
      <g fill="var(--rack-line)">
        <rect x="286" y="102" width="40" height="8" rx="4"/><rect x="286" y="152" width="40" height="8" rx="4"/>
        <rect x="286" y="202" width="40" height="8" rx="4"/><rect x="286" y="252" width="40" height="8" rx="4"/>
      </g>
      <circle class="led" cx="342" cy="106" r="5" fill="var(--mint)"/>
      <circle class="led l2" cx="356" cy="106" r="5" fill="var(--sun)"/>
      <circle class="led l3" cx="342" cy="156" r="5" fill="var(--mint)"/>
      <circle class="led l4" cx="356" cy="156" r="5" fill="var(--coral)"/>
      <circle class="led l2" cx="342" cy="206" r="5" fill="var(--sun)"/>
      <circle class="led" cx="356" cy="206" r="5" fill="var(--mint)"/>
      <circle class="led l4" cx="342" cy="256" r="5" fill="var(--coral)"/>
      <circle class="led l3" cx="356" cy="256" r="5" fill="var(--mint)"/>
      <rect x="284" y="282" width="72" height="6" rx="3" fill="var(--rack-line)"/>
    </g>

    <!-- technicien gauche : casque + portable -->
    <g class="char">
      <rect x="92" y="212" width="62" height="86" rx="28" fill="var(--mint)"/>
      <circle cx="123" cy="176" r="34" fill="#8d5a3b"/>
      <path d="M91 170a32 32 0 0 1 64 0c-12-14-50-14-64 0z" fill="#2b2a55"/>
      <path d="M89 176a34 34 0 0 1 68 0" fill="none" stroke="#2b2a55" stroke-width="5" stroke-linecap="round"/>
      <rect x="82" y="172" width="12" height="24" rx="6" fill="var(--coral)"/>
      <rect x="152" y="172" width="12" height="24" rx="6" fill="var(--coral)"/>
      <path d="M92 196q4 18 26 18" fill="none" stroke="#2b2a55" stroke-width="3" stroke-linecap="round"/>
      <circle cx="118" cy="214" r="4" fill="#2b2a55"/>
      <ellipse class="eye" cx="111" cy="178" rx="3.6" ry="4.4" fill="#2b2a55"/>
      <ellipse class="eye" cx="135" cy="178" rx="3.6" ry="4.4" fill="#2b2a55"/>
      <circle cx="101" cy="188" r="5" fill="#ff8a7a" opacity=".55"/>
      <circle cx="145" cy="188" r="5" fill="#ff8a7a" opacity=".55"/>
      <path d="M115 190q8 7 16 0" fill="none" stroke="#2b2a55" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- portable -->
    <g>
      <rect x="140" y="268" width="84" height="12" rx="6" fill="var(--rack-line)"/>
      <rect x="150" y="226" width="64" height="46" rx="8" fill="var(--rack)"/>
      <text x="160" y="256" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" fill="var(--mint)">&gt;_<tspan class="cursor">▌</tspan></text>
    </g>

    <!-- technicien droit : casque de chantier + clé -->
    <rect x="474" y="268" width="74" height="40" rx="8" fill="var(--sun)"/>
    <rect x="474" y="268" width="74" height="10" rx="5" fill="#e9b93a"/>
    <g class="char b">
      <rect x="480" y="190" width="62" height="86" rx="28" fill="var(--coral)"/>
      <circle cx="511" cy="156" r="34" fill="#f6c8a0"/>
      <path d="M475 150a36 34 0 0 1 72 0z" fill="var(--sun)"/>
      <rect x="469" y="146" width="84" height="9" rx="4.5" fill="#e9b93a"/>
      <rect x="505" y="114" width="12" height="14" rx="4" fill="#e9b93a"/>
      <ellipse class="eye" cx="499" cy="164" rx="3.6" ry="4.4" fill="#2b2a55"/>
      <ellipse class="eye" cx="523" cy="164" rx="3.6" ry="4.4" fill="#2b2a55"/>
      <circle cx="489" cy="174" r="5" fill="#ff8a7a" opacity=".55"/>
      <circle cx="533" cy="174" r="5" fill="#ff8a7a" opacity=".55"/>
      <path d="M503 175q8 7 16 0" fill="none" stroke="#2b2a55" stroke-width="3" stroke-linecap="round"/>
      <!-- clé à molette -->
      <g class="wrench">
        <rect x="548" y="150" width="9" height="56" rx="4.5" fill="#c8c6ee"/>
        <path d="M542 148a10 10 0 0 1 21 0v6h-6v-5a4 4 0 0 0-9 0v5h-6z" fill="#c8c6ee"/>
      </g>
    </g>

    <!-- bulle -->
    <g class="bubble">
      <rect x="396" y="40" width="112" height="40" rx="20" fill="var(--card)"/>
      <path d="M430 80l-8 14 20-12z" fill="var(--card)"/>
      <text x="452" y="66" text-anchor="middle" font-family="Fredoka, system-ui, sans-serif" font-size="17" font-weight="500" fill="var(--ink)">ping… ok !</text>
    </g>
  </svg>

  <h1>Je remets mon portfolio au propre</h1>
  <p class="lead">
    Le portfolio de <strong>K. FRANCK</strong>, administrateur système, est en cours de maintenance.
    Les techniciens vérifient les câbles, je reviens très bientôt.
  </p>

  <div class="status" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span id="msg">Branchement des câbles…</span>
  </div>

  <div class="bar" aria-hidden="true"><i></i></div>

  <footer>Merci de votre patience et à très vite !</footer>
</main>

<script>
  (function () {
    var steps = [
      "Branchement des câbles…",
      "Mise à jour des serveurs…",
      "Test de la connexion…",
      "Dernières vérifications…"
    ];
    var el = document.getElementById("msg");
    var i = 0;
    setInterval(function () {
      el.style.opacity = 0;
      setTimeout(function () {
        i = (i + 1) % steps.length;
        el.textContent = steps[i];
        el.style.opacity = 1;
      }, 250);
    }, 2800);
  })();
</script>
</body>
</html>
